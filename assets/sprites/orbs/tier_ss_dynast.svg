<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Soft Crimson Aura -->
    <radialGradient id="ss-aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDA4AF" stop-opacity="0.38"/>
      <stop offset="40%" stop-color="#E11D48" stop-opacity="0.22"/>
      <stop offset="75%" stop-color="#9F1239" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#4C0519" stop-opacity="0"/>
    </radialGradient>

    <!-- Ruby Nucleus Gradient -->
    <radialGradient id="ss-ruby-core" cx="36%" cy="34%" r="65%">
      <stop offset="0%" stop-color="#FFF1F2"/>
      <stop offset="20%" stop-color="#FDA4AF"/>
      <stop offset="45%" stop-color="#E11D48"/>
      <stop offset="78%" stop-color="#9F1239"/>
      <stop offset="100%" stop-color="#4C0519"/>
    </radialGradient>

    <!-- Coronet Linear Gradient -->
    <linearGradient id="ss-coronet" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF1F2"/>
      <stop offset="30%" stop-color="#F43F5E"/>
      <stop offset="70%" stop-color="#BE123C"/>
      <stop offset="100%" stop-color="#4C0519"/>
    </linearGradient>

    <!-- Ruby Gem Inset -->
    <linearGradient id="ss-gem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE4E6"/>
      <stop offset="35%" stop-color="#FB7185"/>
      <stop offset="75%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>

    <!-- Orbit Ring Gradient -->
    <linearGradient id="ss-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE4E6" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#F43F5E" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#9F1239" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="ss-glow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="5.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="ss-soft-glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- LAYER 1: CRIMSON AMBIENT AURA -->
  <g id="layer-aura">
    <circle cx="128" cy="128" r="106" fill="url(#ss-aura)"/>
    <circle cx="128" cy="128" r="66" fill="#E11D48" opacity="0.16" filter="url(#ss-glow)"/>
  </g>

  <!-- LAYER 2: CEREMONIAL ORBIT & RESONANCE RING -->
  <g id="layer-orbits">
    <!-- Primary Dynast Orbit (-26deg) -->
    <ellipse cx="128" cy="128" rx="92" ry="32" transform="rotate(-26 128 128)"
             fill="none" stroke="url(#ss-ring)" stroke-width="2.2" opacity="0.85"/>
    <!-- Subordinate Dashed Halo -->
    <circle cx="128" cy="128" r="76"
            fill="none" stroke="#FB7185" stroke-width="1.4" stroke-dasharray="6 8" opacity="0.55"/>
  </g>

  <!-- LAYER 3: RUBY CORE BODY & NOBLE MANTLE -->
  <g id="layer-core">
    <!-- Dynastic Mantle / Shield Cut -->
    <path d="M82 118 L89 164 L128 188 L167 164 L174 118 Z"
          fill="url(#ss-ruby-core)" stroke="#FECDD3" stroke-width="2" filter="url(#ss-soft-glow)"/>
    
    <!-- Facet Division Lines -->
    <path d="M82 118 L128 142 L174 118 M89 164 L128 142 L167 164 M128 142 V188"
          fill="none" stroke="#FFE4E6" stroke-width="1.6" opacity="0.65"/>
    
    <!-- Inner Radiant Orb -->
    <circle cx="128" cy="136" r="32" fill="url(#ss-ruby-core)" stroke="#FDA4AF" stroke-width="1.4"/>
  </g>

  <!-- LAYER 4: HEIR CORONET (Subordinate to Emperor Crown) -->
  <g id="layer-coronet" filter="url(#ss-soft-glow)">
    <!-- 3-Spire Royal Heir Coronet -->
    <path d="M82 104 L92 68 L114 84 L128 54 L142 84 L164 68 L174 104 L160 118 H96 Z"
          fill="url(#ss-coronet)" stroke="#FFE4E6" stroke-width="2.2" stroke-linejoin="round"/>
    
    <!-- Coronet Spire Jewels -->
    <circle cx="128" cy="54" r="5.5" fill="#FFFFFF" stroke="#9F1239" stroke-width="1.8" filter="url(#ss-glow)"/>
    <circle cx="92" cy="68" r="4" fill="#FECDD3" stroke="#881337" stroke-width="1.2"/>
    <circle cx="164" cy="68" r="4" fill="#FECDD3" stroke="#881337" stroke-width="1.2"/>

    <!-- Coronet Band Jewels -->
    <circle cx="112" cy="112" r="2" fill="#FFF"/>
    <circle cx="128" cy="112" r="2.8" fill="#FFF"/>
    <circle cx="144" cy="112" r="2" fill="#FFF"/>
  </g>

  <!-- LAYER 5: RUBY EYE CENTERPIECE -->
  <g id="layer-emblem">
    <!-- Marquise Diamond Gem -->
    <path d="M114 138 L128 118 L142 138 L128 158 Z"
          fill="url(#ss-gem)" stroke="#FFFFFF" stroke-width="1.8" filter="url(#ss-soft-glow)"/>
    <!-- Facet lines -->
    <path d="M114 138 H142 M128 118 V158" stroke="#FFF1F2" stroke-width="1" opacity="0.85"/>
    <!-- Highlight Spark -->
    <circle cx="124" cy="130" r="3" fill="#FFFFFF" opacity="0.9"/>
  </g>

  <!-- LAYER 6: CEREMONIAL SATELLITES -->
  <g id="layer-particles">
    <circle cx="56" cy="104" r="3.5" fill="#FFE4E6" filter="url(#ss-glow)"/>
    <circle cx="204" cy="150" r="3" fill="#FDA4AF" filter="url(#ss-glow)"/>
    <circle cx="178" cy="90" r="2" fill="#FECDD3"/>
    <circle cx="86" cy="188" r="2.5" fill="#F43F5E" opacity="0.8"/>
  </g>
</svg>
