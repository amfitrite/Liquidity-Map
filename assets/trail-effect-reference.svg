<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180">
<defs>
 <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#111B2B"/><stop offset="1" stop-color="#080D16"/></linearGradient>
 <radialGradient id="orb"><stop stop-color="#FFFFFF"/><stop offset=".38" stop-color="#D9FBFF"/><stop offset="1" stop-color="#0891B2"/></radialGradient>
 <linearGradient id="ribbon" x1="0" x2="1"><stop stop-color="#22D3EE" stop-opacity="0"/><stop offset=".22" stop-color="#22D3EE" stop-opacity=".25"/><stop offset=".7" stop-color="#67E8F9" stop-opacity=".58"/><stop offset="1" stop-color="#CFFAFE" stop-opacity=".82"/></linearGradient>
 <filter id="glow" x="-30%" y="-200%" width="160%" height="500%"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="mist" x="-30%" y="-300%" width="160%" height="700%"><feGaussianBlur stdDeviation="17"/></filter>
 <filter id="soft" x="-30%" y="-200%" width="160%" height="500%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1600" height="1180" rx="30" fill="url(#bg)"/>
<g font-family="Inter,Segoe UI,Arial,sans-serif">
 <text x="74" y="78" fill="#F8FAFC" font-size="35" font-weight="750" letter-spacing="1.5">LIQUIDITY MAP / MOVEMENT TRAILS</text>
 <text x="76" y="112" fill="#94A3B8" font-size="17">MOBA-inspired movement residue · the orb is the live head · the trail remains behind and dissipates</text>
 <g transform="translate(0 145)">
  <rect x="56" y="0" width="1488" height="174" rx="18" fill="#111C2B" stroke="#26384B"/>
  <text x="92" y="43" fill="#F8FAFC" font-size="22" font-weight="700">01  NO EFFECT</text>
  <text x="92" y="71" fill="#94A3B8" font-size="14">Plain straight line · no glow, particles, texture, or animation</text>
  <line x1="420" y1="98" x2="1320" y2="98" stroke="#67E8F9" stroke-width="2.5"/>
  <circle cx="1320" cy="98" r="17" fill="url(#orb)" stroke="#E0FCFF" stroke-width="2"/>
  <text x="420" y="137" fill="#64748B" font-size="12">OLDER TRAIL</text><text x="1320" y="137" text-anchor="middle" fill="#A5F3FC" font-size="12">LIVE ORB</text>
 </g>
 <g transform="translate(0 335)">
  <rect x="56" y="0" width="1488" height="174" rx="18" fill="#111C2B" stroke="#26384B"/>
  <text x="92" y="43" fill="#F8FAFC" font-size="22" font-weight="700">02  AURORA FLOW</text>
  <text x="92" y="71" fill="#94A3B8" font-size="14">Soft luminous ribbon · layered translucent flow · rounded, diffused tail</text>
  <path d="M420 100 C610 89 750 107 920 98 S1150 87 1320 98" fill="none" stroke="#0891B2" stroke-opacity=".18" stroke-width="34" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M420 100 C610 89 750 107 920 98 S1150 87 1320 98" fill="none" stroke="url(#ribbon)" stroke-width="23" stroke-linecap="round" filter="url(#soft)"/>
  <path d="M510 96 C680 91 820 103 980 98 S1170 93 1320 98" fill="none" stroke="#D9FBFF" stroke-opacity=".45" stroke-width="4" stroke-linecap="round"/>
  <circle cx="1320" cy="98" r="17" fill="url(#orb)" stroke="#E0FCFF" stroke-width="2" filter="url(#soft)"/>
  <text x="420" y="137" fill="#64748B" font-size="12">OLDER / FADING</text><text x="1320" y="137" text-anchor="middle" fill="#A5F3FC" font-size="12">LIVE ORB</text>
 </g>
 <g transform="translate(0 525)">
