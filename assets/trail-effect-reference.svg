  </g>
  <g fill="#CFFAFE"><circle cx="550" cy="78" r="1" opacity=".18"/><circle cx="640" cy="119" r="1.1" opacity=".28"/><circle cx="755" cy="119" r="1.1" opacity=".32"/><circle cx="864" cy="71" r="1.2" opacity=".4"/><circle cx="940" cy="121" r="1.3" opacity=".48"/><circle cx="1050" cy="73" r="1.2" opacity=".55"/><circle cx="1135" cy="123" r="1.3" opacity=".7"/><circle cx="1210" cy="72" r="1.3" opacity=".85"/></g>
  <circle cx="1320" cy="98" r="17" fill="url(#orb)" stroke="#E0FCFF" stroke-width="2" filter="url(#soft)"/>
  <text x="420" y="137" fill="#64748B" font-size="12">OLDER / FADING</text><text x="1320" y="137" text-anchor="middle" fill="#A5F3FC" font-size="12">LIVE ORB</text>
 </g>
 <g transform="translate(0 715)">
  <rect x="56" y="0" width="1488" height="174" rx="18" fill="#111C2B" stroke="#26384B"/>
  <text x="92" y="43" fill="#F8FAFC" font-size="22" font-weight="700">04  MIST VEIL</text>
  <text x="92" y="71" fill="#94A3B8" font-size="14">Diffuse soft haze · overlapping wisps · no hard edges or impact burst</text>
  <g fill="#22D3EE" filter="url(#mist)">
   <ellipse cx="560" cy="100" rx="100" ry="15" opacity=".08"/><ellipse cx="700" cy="99" rx="132" ry="19" opacity=".11"/><ellipse cx="850" cy="98" rx="142" ry="20" opacity=".14"/><ellipse cx="990" cy="99" rx="144" ry="22" opacity=".17"/><ellipse cx="1120" cy="98" rx="122" ry="20" opacity=".20"/><ellipse cx="1230" cy="98" rx="83" ry="17" opacity=".22"/>
  </g>
