<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1770" viewBox="0 0 1600 1770">
<defs>
 <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#111B2B"/><stop offset="1" stop-color="#080D16"/></linearGradient>
 <radialGradient id="orb"><stop stop-color="#FFFFFF"/><stop offset=".38" stop-color="#D9FBFF"/><stop offset="1" stop-color="#0891B2"/></radialGradient>
 <linearGradient id="ribbon" x1="0" x2="1"><stop stop-color="#22D3EE" stop-opacity="0"/><stop offset=".24" stop-color="#22D3EE" stop-opacity=".22"/><stop offset=".7" stop-color="#67E8F9" stop-opacity=".55"/><stop offset="1" stop-color="#CFFAFE" stop-opacity=".82"/></linearGradient>
 <filter id="glow" x="-30%" y="-250%" width="160%" height="600%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="mist" x="-30%" y="-400%" width="160%" height="900%"><feGaussianBlur stdDeviation="14"/></filter>
 <filter id="soft" x="-30%" y="-250%" width="160%" height="600%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1600" height="1770" rx="30" fill="url(#bg)"/>
<g font-family="Inter,Segoe UI,Arial,sans-serif">
 <text x="72" y="75" fill="#F8FAFC" font-size="35" font-weight="750" letter-spacing="1.3">LIQUIDITY MAP / 10 MOVEMENT TRAILS</text>
 <text x="74" y="111" fill="#94A3B8" font-size="17">MOBA-inspired cosmetic trail styles · orb is the live head · effects remain behind and dissipate</text>
 <text x="74" y="143" fill="#67E8F9" font-size="13" letter-spacing="1">ILLUSTRATIVE TIER COLOR: CYAN · ACTUAL TRAIL COLOR FOLLOWS THE ORB'S LIQUIDITY TIER</text>
 
 <!-- 01 No Effect -->
 <g transform="translate(55 175)">
  <rect width="720" height="285" rx="18" fill="#111C2B" stroke="#26384B"/>
  <text x="30" y="42" fill="#F8FAFC" font-size="21" font-weight="700">01  NO EFFECT</text>
  <text x="30" y="68" fill="#94A3B8" font-size="13">Plain straight line · no visual treatment</text>
  <line x1="125" y1="155" x2="620" y2="155" stroke="#67E8F9" stroke-width="2.5"/>
  <circle cx="620" cy="155" r="16" fill="url(#orb)" stroke="#E0FCFF" stroke-width="2"/>
  <text x="125" y="205" fill="#64748B" font-size="11">HISTORY</text><text x="620" y="205" text-anchor="middle" fill="#A5F3FC" font-size="11">LIVE ORB</text>
 </g>
 <!-- 02 Aurora Flow -->
 <g transform="translate(825 175)">
  <rect width="720" height="285" rx="18" fill="#111C2B" stroke="#26384B"/>
  <text x="30" y="42" fill="#F8FAFC" font-size="21" font-weight="700">02  AURORA FLOW</text>
  <text x="30" y="68" fill="#94A3B8" font-size="13">Broad soft ribbon · flowing translucent layers</text>
  <path d="M125 155 C245 140 330 166 430 153 S555 142 620 155" fill="none" stroke="#0891B2" stroke-opacity=".18" stroke-width="32" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M125 155 C245 140 330 166 430 153 S555 142 620 155" fill="none" stroke="url(#ribbon)" stroke-width="23" stroke-linecap="round" filter="url(#soft)"/>
  <path d="M225 151 C340 145 430 161 520 151 S582 151 620 155" fill="none" stroke="#D9FBFF" stroke-opacity=".4" stroke-width="3" stroke-linecap="round"/>
  <circle cx="620" cy="155" r="16" fill="url(#orb)" stroke="#E0FCFF" stroke-width="2"/>
 </g>
 <!-- 03 Particle Wake -->
 <g transform="translate(55 485)">
  <rect width="720" height="285" rx="18" fill="#111C2B" stroke="#26384B"/>
  <text x="30" y="42" fill="#F8FAFC" font-size="21" font-weight="700">03  PARTICLE WAKE</text>
  <text x="30" y="68" fill="#94A3B8" font-size="13">Motes deposited along the path · gentle spread and fade</text>
  <path d="M125 155H620" stroke="#22D3EE" stroke-opacity=".12" stroke-width="2"/>
  <g fill="#67E8F9" filter="url(#soft)">
   <circle cx="155" cy="153" r="1.5" opacity=".18"/><circle cx="184" cy="165" r="2" opacity=".22"/><circle cx="215" cy="145" r="1.7" opacity=".27"/><circle cx="245" cy="157" r="2.4" opacity=".31"/><circle cx="278" cy="140" r="1.8" opacity=".36"/><circle cx="308" cy="171" r="2.1" opacity=".4"/><circle cx="338" cy="153" r="2.7" opacity=".44"/><circle cx="370" cy="139" r="1.8" opacity=".5"/><circle cx="400" cy="166" r="2.6" opacity=".56"/><circle cx="430" cy="151" r="3" opacity=".61"/><circle cx="462" cy="174" r="2.2" opacity=".67"/><circle cx="492" cy="140" r="2.7" opacity=".72"/><circle cx="520" cy="157" r="3.2" opacity=".78"/><circle cx="550" cy="146" r="3.4" opacity=".84"/><circle cx="580" cy="162" r="3.6" opacity=".9"/>
  </g>
  <circle cx="620" cy="155" r="16" fill="url(#orb)" stroke="#E0FCFF" stroke-width="2"/>
 </g>
 <!-- 04 Mist Veil -->
 <g transform="translate(825 485)">
  <rect width="720" height="285" rx="18" fill="#111C2B" stroke="#26384B"/>
  <text x="30" y="42" fill="#F8FAFC" font-size="21" font-weight="700">04  MIST VEIL</text>
  <text x="30" y="68" fill="#94A3B8" font-size="13">Diffuse haze · low-contrast wisps · slow dissipation</text>
  <g fill="#22D3EE" filter="url(#mist)">
   <ellipse cx="235" cy="157" rx="95" ry="17" opacity=".08"/><ellipse cx="330" cy="154" rx="128" ry="22" opacity=".11"/><ellipse cx="435" cy="155" rx="130" ry="23" opacity=".15"/><ellipse cx="530" cy="154" rx="108" ry="21" opacity=".19"/>
  </g>
  <g fill="#A5F3FC" filter="url(#mist)"><ellipse cx="370" cy="143" rx="145" ry="9" opacity=".1"/><ellipse cx="500" cy="166" rx="105" ry="10" opacity=".11"/></g>
  <circle cx="620" cy="155" r="16" fill="url(#orb)" stroke="#E0FCFF" stroke-width="2"/>
 </g>
 <!-- 05 Afterimage Echo -->
 <g transform="translate(55 795)">
  <rect width="720" height="285" rx="18" fill="#111C2B" stroke="#26384B"/>
  <text x="30" y="42" fill="#F8FAFC" font-size="21" font-weight="700">05  AFTERIMAGE ECHO</text>
  <text x="30" y="68" fill="#94A3B8" font-size="13">Faint orb copies · older echoes become smaller and dimmer</text>
  <g fill="#67E8F9" filter="url(#soft)">
   <circle cx="205" cy="155" r="5" opacity=".10"/><circle cx="275" cy="155" r="6" opacity=".15"/><circle cx="345" cy="155" r="7" opacity=".23"/><circle cx="415" cy="155" r="8" opacity=".32"/><circle cx="485" cy="155" r="10" opacity=".43"/><circle cx="545" cy="155" r="12" opacity=".58"/>
  </g>
  <circle cx="620" cy="155" r="16" fill="url(#orb)" stroke="#E0FCFF" stroke-width="2"/>
 </g>
 <!-- 06 Twin Streamers -->
 <g transform="translate(825 795)">
  <rect width="720" height="285" rx="18" fill="#111C2B" stroke="#26384B"/>
  <text x="30" y="42" fill="#F8FAFC" font-size="21" font-weight="700">06  TWIN STREAMERS</text>
  <text x="30" y="68" fill="#94A3B8" font-size="13">Parallel soft filaments · gentle lateral waviness</text>
  <path d="M125 143 C235 123 330 163 430 144 S550 133 620 155" fill="none" stroke="#22D3EE" stroke-opacity=".32" stroke-width="7" stroke-linecap="round" filter="url(#soft)"/>
  <path d="M125 167 C235 187 330 147 430 166 S550 177 620 155" fill="none" stroke="#67E8F9" stroke-opacity=".40" stroke-width="7" stroke-linecap="round" filter="url(#soft)"/>
  <path d="M270 150 C360 145 455 159 560 151" fill="none" stroke="#D9FBFF" stroke-opacity=".35" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="620" cy="155" r="16" fill="url(#orb)" stroke="#E0FCFF" stroke-width="2"/>
 </g>
 <!-- 07 Sparkle Drift -->
 <g transform="translate(55 1105)">
  <rect width="720" height="285" rx="18" fill="#111C2B" stroke="#26384B"/>
  <text x="30" y="42" fill="#F8FAFC" font-size="21" font-weight="700">07  SPARKLE DRIFT</text>
  <text x="30" y="68" fill="#94A3B8" font-size="13">Sparse tiny glints and motes distributed along the wake</text>
  <g fill="#A5F3FC" filter="url(#soft)">
   <path d="M175 142l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" opacity=".18"/>
   <path d="M250 161l2 6 6 2-6 2-2 6-2-6-6-2 6-2z" opacity=".25"/>
   <path d="M330 139l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" opacity=".33"/>
   <path d="M405 165l2 6 6 2-6 2-2 6-2-6-6-2 6-2z" opacity=".43"/>
   <path d="M485 143l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" opacity=".58"/>
   <path d="M550 160l2 6 6 2-6 2-2 6-2-6-6-2 6-2z" opacity=".72"/>
  </g>
  <g fill="#67E8F9"><circle cx="210" cy="177" r="1.8" opacity=".25"/><circle cx="292" cy="126" r="2" opacity=".32"/><circle cx="375" cy="180" r="2.2" opacity=".38"/><circle cx="460" cy="126" r="2.4" opacity=".55"/><circle cx="520" cy="181" r="2.7" opacity=".7"/></g>
  <circle cx="620" cy="155" r="16" fill="url(#orb)" stroke="#E0FCFF" stroke-width="2"/>
 </g>
 <!-- 08 Frost Dust -->
 <g transform="translate(825 1105)">
  <rect width="720" height="285" rx="18" fill="#111C2B" stroke="#26384B"/>
  <text x="30" y="42" fill="#F8FAFC" font-size="21" font-weight="700">08  FROST DUST</text>
  <text x="30" y="68" fill="#94A3B8" font-size="13">Tiny soft-edged crystalline flecks · no sharp projectiles</text>
  <g stroke="#A5F3FC" stroke-width="1.5" stroke-linecap="round" opacity=".65">
   <path d="M180 145v13m-6-6.5h12m-10-4.5l8 9m0-9l-8 9"/>
   <path d="M270 165v10m-5-5h10m-8-4l6 8m0-8l-6 8"/>
   <path d="M365 138v12m-6-6h12m-9-4l6 8m0-8l-6 8"/>
   <path d="M450 166v9m-4.5-4.5h9"/>
   <path d="M535 145v11m-5.5-5.5h11m-8-4l6 8m0-8l-6 8"/>
  </g>
  <g fill="#CFFAFE" opacity=".48"><circle cx="220" cy="177" r="2"/><circle cx="310" cy="126" r="1.6"/><circle cx="415" cy="184" r="1.8"/><circle cx="495" cy="126" r="2.2"/><circle cx="570" cy="174" r="2.4"/></g>
  <circle cx="620" cy="155" r="16" fill="url(#orb)" stroke="#E0FCFF" stroke-width="2"/>
 </g>
 <!-- 09 Luminous Drift -->
 <g transform="translate(55 1415)">
  <rect width="720" height="285" rx="18" fill="#111C2B" stroke="#26384B"/>
  <text x="30" y="42" fill="#F8FAFC" font-size="21" font-weight="700">09  LUMINOUS DRIFT</text>
  <text x="30" y="68" fill="#94A3B8" font-size="13">Soft elongated glow motes · gently disperse around the path</text>
  <g fill="#22D3EE" filter="url(#glow)">
   <ellipse cx="190" cy="151" rx="7" ry="2" opacity=".13"/><ellipse cx="270" cy="160" rx="8" ry="2.5" opacity=".18"/><ellipse cx="350" cy="145" rx="9" ry="3" opacity=".24"/><ellipse cx="430" cy="162" rx="10" ry="3" opacity=".34"/><ellipse cx="505" cy="149" rx="12" ry="4" opacity=".46"/><ellipse cx="570" cy="157" rx="13" ry="4.5" opacity=".62"/>
  </g>
  <g fill="#CFFAFE"><circle cx="240" cy="132" r="1.6" opacity=".22"/><circle cx="320" cy="181" r="1.8" opacity=".3"/><circle cx="400" cy="128" r="1.6" opacity=".35"/><circle cx="480" cy="180" r="2" opacity=".5"/></g>
  <circle cx="620" cy="155" r="16" fill="url(#orb)" stroke="#E0FCFF" stroke-width="2"/>
 </g>
 <!-- 10 Ripple Echo -->
 <g transform="translate(825 1415)">
  <rect width="720" height="285" rx="18" fill="#111C2B" stroke="#26384B"/>
  <text x="30" y="42" fill="#F8FAFC" font-size="21" font-weight="700">10  RIPPLE ECHO</text>
  <text x="30" y="68" fill="#94A3B8" font-size="13">Soft elliptical rings left along the path · older rings fade</text>
  <g fill="none" stroke="#67E8F9" stroke-width="1.5">
   <ellipse cx="205" cy="155" rx="22" ry="12" opacity=".12"/>
   <ellipse cx="295" cy="155" rx="19" ry="10" opacity=".18"/>
   <ellipse cx="385" cy="155" rx="16" ry="9" opacity=".27"/>
   <ellipse cx="470" cy="155" rx="13" ry="7" opacity=".38"/>
   <ellipse cx="540" cy="155" rx="10" ry="6" opacity=".53"/>
   <ellipse cx="585" cy="155" rx="8" ry="5" opacity=".66"/>
  </g>
  <circle cx="620" cy="155" r="16" fill="url(#orb)" stroke="#E0FCFF" stroke-width="2"/>
 </g>
 <text x="76" y="1740" fill="#64748B" font-size="13">Concept reference only · each effect is residue behind the live orb along recorded history, never a slash, attack arc, or forward projectile.</text>
</g>
</svg>