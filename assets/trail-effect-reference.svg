  <circle cx="1320" cy="98" r="17" fill="url(#orb)" stroke="#E0FCFF" stroke-width="2" filter="url(#soft)"/>
  <text x="420" y="137" fill="#64748B" font-size="12">OLDER / FADING</text><text x="1320" y="137" text-anchor="middle" fill="#A5F3FC" font-size="12">LIVE ORB</text>
 </g>
 <g transform="translate(0 905)">
  <rect x="56" y="0" width="1488" height="174" rx="18" fill="#111C2B" stroke="#26384B"/>
  <text x="92" y="43" fill="#F8FAFC" font-size="22" font-weight="700">05  AFTERIMAGE ECHO</text>
  <text x="92" y="71" fill="#94A3B8" font-size="14">Soft repeated orb echoes · each older echo becomes smaller, dimmer, and more diffuse</text>
  <g>
   <circle cx="590" cy="98" r="5" fill="#67E8F9" opacity=".12" filter="url(#soft)"/>
   <circle cx="700" cy="98" r="6" fill="#67E8F9" opacity=".18" filter="url(#soft)"/>
   <circle cx="810" cy="98" r="7" fill="#67E8F9" opacity=".25" filter="url(#soft)"/>
   <circle cx="920" cy="98" r="8" fill="#67E8F9" opacity=".34" filter="url(#soft)"/>
   <circle cx="1030" cy="98" r="10" fill="#67E8F9" opacity=".44" filter="url(#soft)"/>
   <circle cx="1140" cy="98" r="11" fill="#67E8F9" opacity=".56" filter="url(#soft)"/>
   <circle cx="1245" cy="98" r="13" fill="#67E8F9" opacity=".72" filter="url(#soft)"/>
  </g>
  <circle cx="1320" cy="98" r="17" fill="url(#orb)" stroke="#E0FCFF" stroke-width="2" filter="url(#soft)"/>
  <text x="420" y="137" fill="#64748B" font-size="12">OLDER ECHOES</text><text x="1320" y="137" text-anchor="middle" fill="#A5F3FC" font-size="12">LIVE ORB</text>
 </g>
 <text x="76" y="1138" fill="#64748B" font-size="13">Concept reference · cyan is illustrative only; runtime tint follows liquidity tier · every effect is residue behind the orb, never an attack slash or forward projectile.</text>
</g>
</svg>