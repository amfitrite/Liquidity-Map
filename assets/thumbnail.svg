<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="thumb-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0E1424"/>
      <stop offset="45%" stop-color="#0A0D17"/>
      <stop offset="100%" stop-color="#04060B"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="thumb-grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="48" y2="0" stroke="#334155" stroke-opacity="0.12" stroke-width="1"/>
      <line x1="0" y1="0" x2="0" y2="48" stroke="#334155" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>

    <!-- Title Gradient -->
    <linearGradient id="text-gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFDF0"/>
      <stop offset="35%" stop-color="#FDE047"/>
      <stop offset="70%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="thumb-bloom" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="hero-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24" result="b1"/>
      <feGaussianBlur stdDeviation="8" result="b2"/>
      <feMerge>
        <feMergeNode in="b1"/>
        <feMergeNode in="b2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Horizontal Dissipation Gradients for Multi-Tier Rays -->
    <linearGradient id="ray-sss" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="ray-ss" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF303B" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FF303B" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FF303B" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="ray-s" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF7900" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FF7900" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FF7900" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="ray-a" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFD52A" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFD52A" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FFD52A" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="ray-b" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#73E6FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#73E6FF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#73E6FF" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="ray-c" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2787E5" stop-opacity="0"/>
      <stop offset="50%" stop-color="#2787E5" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#2787E5" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <!-- 1. BASE BACKGROUND -->
  <rect width="1280" height="720" fill="url(#thumb-bg)"/>
  <rect width="1280" height="720" fill="url(#thumb-grid)"/>

  <!-- Ambient Nebula Blobs -->
  <circle cx="340" cy="360" r="260" fill="#38BDF8" opacity="0.08" filter="url(#hero-glow)"/>
  <circle cx="300" cy="320" r="200" fill="#FDE047" opacity="0.06" filter="url(#hero-glow)"/>

  <!-- 2. BACKGROUND HORIZONTAL LIQUIDITY HORIZON RAYS -->
  <g opacity="0.75">
    <!-- SSS White -->
    <line x1="180" y1="140" x2="1240" y2="140" stroke="url(#ray-sss)" stroke-width="2.5" filter="url(#thumb-bloom)"/>
    <circle cx="1240" cy="140" r="4.5" fill="#FFF" filter="url(#thumb-bloom)"/>
    
    <!-- SS Red -->
    <line x1="280" y1="210" x2="1240" y2="210" stroke="url(#ray-ss)" stroke-width="2.2" filter="url(#thumb-bloom)"/>
    <circle cx="1240" cy="210" r="4" fill="#FF303B" filter="url(#thumb-bloom)"/>

    <!-- S Orange -->
    <line x1="380" y1="280" x2="1240" y2="280" stroke="url(#ray-s)" stroke-width="2" filter="url(#thumb-bloom)"/>
    <circle cx="1240" cy="280" r="3.5" fill="#FF7900" filter="url(#thumb-bloom)"/>

    <!-- A Yellow -->
    <line x1="480" y1="440" x2="1240" y2="440" stroke="url(#ray-a)" stroke-width="2" filter="url(#thumb-bloom)"/>
    <circle cx="1240" cy="440" r="3.5" fill="#FFD52A" filter="url(#thumb-bloom)"/>

    <!-- B Cyan -->
    <line x1="560" y1="510" x2="1240" y2="510" stroke="url(#ray-b)" stroke-width="1.8" filter="url(#thumb-bloom)"/>
    <circle cx="1240" cy="510" r="3" fill="#73E6FF" filter="url(#thumb-bloom)"/>

    <!-- C Cobalt -->
    <line x1="640" y1="580" x2="1240" y2="580" stroke="url(#ray-c)" stroke-width="1.5"/>
    <circle cx="1240" cy="580" r="2.5" fill="#2787E5"/>
  </g>

  <!-- 3. HERO EMBLEM (LEFT-CENTERED) -->
  <g transform="translate(140 180) scale(0.68)">
    <!-- Chassis -->
    <rect x="24" y="24" width="464" height="464" rx="108" fill="#0C101C" stroke="#FDE047" stroke-width="6" filter="url(#hero-glow)"/>
    <rect x="28" y="28" width="456" height="456" rx="104" fill="none" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.5"/>

    <!-- Horizon Line -->
    <line x1="40" y1="256" x2="472" y2="256" stroke="#38BDF8" stroke-width="28" opacity="0.3" filter="url(#hero-glow)"/>
    <line x1="60" y1="256" x2="452" y2="256" stroke="#FFF" stroke-width="4.5" stroke-linecap="round" filter="url(#thumb-bloom)"/>

    <!-- Orbits -->
    <ellipse cx="256" cy="256" rx="170" ry="54" transform="rotate(-30 256 256)" fill="none" stroke="#FDE047" stroke-width="3.5" opacity="0.85" filter="url(#thumb-bloom)"/>
    <ellipse cx="256" cy="256" rx="160" ry="50" transform="rotate(50 256 256)" fill="none" stroke="#38BDF8" stroke-width="2.8" opacity="0.75" filter="url(#thumb-bloom)"/>

    <!-- Dial Ring -->
    <circle cx="256" cy="256" r="105" fill="none" stroke="#D97706" stroke-width="2.5" opacity="0.7"/>
    <circle cx="256" cy="256" r="95" fill="none" stroke="#FDE047" stroke-width="2" stroke-dasharray="8 6"/>

    <!-- Needle -->
    <polygon points="256,155 272,256 256,245 240,256" fill="#38BDF8" stroke="#FFF" stroke-width="2" filter="url(#thumb-bloom)"/>
    <polygon points="256,357 272,256 256,267 240,256" fill="#475569" stroke="#64748B" stroke-width="1.5"/>

    <!-- Crown -->
    <g transform="translate(256 142) scale(0.75)" filter="url(#thumb-bloom)">
      <path d="M-40 -5 L-30 -38 L-12 -20 L0 -52 L12 -20 L30 -38 L40 -5 H-40 Z" fill="#FDE047" stroke="#FFF" stroke-width="3"/>
      <circle cy="-52" r="5.5" fill="#FFF"/>
    </g>

    <!-- Center Pivot Reactor -->
    <circle cx="256" cy="256" r="22" fill="#D97706" opacity="0.4" filter="url(#hero-glow)"/>
    <circle cx="256" cy="256" r="16" fill="#FDE047" stroke="#FFF" stroke-width="3"/>
    <circle cx="256" cy="256" r="6" fill="#FFF"/>
  </g>

  <!-- 4. RIGHT HERO TYPOGRAPHY & BRANDING -->
  <g transform="translate(540 220)" font-family="Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif">
    
    <!-- Top System Badges -->
    <g class="badges" font-size="11" font-weight="700" letter-spacing="1">
      <rect x="0" y="0" width="138" height="26" rx="6" fill="#0284C7" fill-opacity="0.2" stroke="#38BDF8" stroke-width="1"/>
      <circle cx="14" cy="13" r="3.5" fill="#38BDF8"/>
      <text x="25" y="17" fill="#7DD3FC">XAUUSD POOL</text>

      <rect x="150" y="0" width="168" height="26" rx="6" fill="#10B981" fill-opacity="0.2" stroke="#10B981" stroke-width="1"/>
      <circle cx="164" cy="13" r="3.5" fill="#34D399"/>
      <text x="175" y="17" fill="#6EE7B7">DUKASCOPY LIVE</text>

      <rect x="330" y="0" width="155" height="26" rx="6" fill="#F59E0B" fill-opacity="0.2" stroke="#F59E0B" stroke-width="1"/>
      <circle cx="344" cy="13" r="3.5" fill="#FBBF24"/>
      <text x="355" y="17" fill="#FDE68A">GAME ENGINE v1.0</text>
    </g>

    <!-- Master Title -->
    <text x="0" y="90" fill="url(#text-gold)" font-size="64" font-weight="900" letter-spacing="3" filter="url(#thumb-bloom)">
      LIQUIDITY MAP
    </text>

    <!-- Subtitle -->
    <text x="2" y="130" fill="#F8FAFC" font-size="20" font-weight="700" letter-spacing="2">
      CENTERED LIVE-PRICE GAME WORLD
    </text>

    <text x="2" y="160" fill="#94A3B8" font-size="14" font-weight="400">
      Royal Hierarchy Orbs · Straight-Line Liquidity Horizons · Follow Camera
    </text>

    <!-- Telemetry Status Bar -->
    <g transform="translate(0 200)">
      <rect width="660" height="60" rx="12" fill="#121829" stroke="#334155" stroke-width="1"/>
      
      <g transform="translate(24 24)" font-size="12">
        <text x="0" y="0" fill="#64748B" font-family="monospace">ANCHOR</text>
        <text x="0" y="20" fill="#38BDF8" font-weight="700" font-family="monospace">CENTER (cx, cy)</text>

        <text x="160" y="0" fill="#64748B" font-family="monospace">TRAIL HEATMAP</text>
        <text x="160" y="20" fill="#FDE047" font-weight="700" font-family="monospace">7-TIER SSS → D</text>

        <text x="330" y="0" fill="#64748B" font-family="monospace">BUDGET</text>
        <text x="330" y="20" fill="#F8FAFC" font-weight="700" font-family="monospace">120 OBJECT CAP</text>

        <text x="470" y="0" fill="#64748B" font-family="monospace">GUI FRAME</text>
        <text x="470" y="20" fill="#34D399" font-weight="700" font-family="monospace">CHROME FRAMELESS</text>
      </g>
    </g>

  </g>

  <!-- Frame border accent -->
  <rect x="0" y="0" width="1280" height="720" fill="none" stroke="#334155" stroke-width="2" opacity="0.4"/>
</svg>
