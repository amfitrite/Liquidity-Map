<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000">
<defs>
<linearGradient id="bg" x2="0" y2="1"><stop stop-color="#171522"/><stop offset="1" stop-color="#080B12"/></linearGradient><linearGradient id="card" x2="1" y2="1"><stop stop-color="#292638"/><stop offset="1" stop-color="#10131D"/></linearGradient>
<radialGradient id="g"><stop stop-color="#FFF8D6"/><stop offset=".3" stop-color="#FFE9A3"/><stop offset=".65" stop-color="#D6A332"/><stop offset="1" stop-color="#63390D"/></radialGradient><radialGradient id="r"><stop stop-color="#FFE1D9"/><stop offset=".4" stop-color="#D94358"/><stop offset="1" stop-color="#4A1029"/></radialGradient><radialGradient id="p"><stop stop-color="#E9D5FF"/><stop offset=".45" stop-color="#9270D9"/><stop offset="1" stop-color="#241641"/></radialGradient><radialGradient id="b"><stop stop-color="#DCEBFF"/><stop offset=".45" stop-color="#438DE5"/><stop offset="1" stop-color="#10234C"/></radialGradient><radialGradient id="j"><stop stop-color="#D1FAE5"/><stop offset=".5" stop-color="#48B58D"/><stop offset="1" stop-color="#103B36"/></radialGradient><radialGradient id="i"><stop stop-color="#E2E8F0"/><stop offset=".5" stop-color="#718096"/><stop offset="1" stop-color="#1E293B"/></radialGradient><radialGradient id="c"><stop stop-color="#D6B99A"/><stop offset=".55" stop-color="#8B674B"/><stop offset="1" stop-color="#261D18"/></radialGradient><filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="9" result="x"/><feMerge><feMergeNode in="x"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect width="1500" height="1000" fill="url(#bg)"/><g font-family="Inter,Segoe UI,Arial,sans-serif">
<text x="55" y="55" fill="#FFF3D5" font-size="30" font-weight="800" letter-spacing="2">LIQUIDITY ORB · ROYAL HIERARCHY</text><text x="57" y="85" fill="#A9A5B5" font-size="14">From sovereign emperor to common folk · tier identity is separate from trail heatmap</text><path d="M55 108H1445" stroke="#78664A" opacity=".6"/>
<!-- cards -->
<g transform="translate(55 135)"><rect width="330" height="330" rx="18" fill="url(#card)" stroke="#D6A94B" stroke-width="2"/><text x="20" y="32" fill="#F8D77C" font-size="13" font-weight="800">SSS · THE SOVEREIGN</text><text x="20" y="58" fill="#FFF0BE" font-size="20" font-weight="800">GOLDEN EMPEROR</text><text x="20" y="78" fill="#B7A47B" font-size="11">Absolute ruler · imperial crown · regalia</text><g transform="translate(165 190)"><circle r="105" fill="#DCA83B" opacity=".18" filter="url(#glow)"/><circle r="83" fill="none" stroke="#F6D77E" stroke-width="2"/><ellipse rx="94" ry="32" transform="rotate(-32)" fill="none" stroke="#E8BD5B" stroke-width="3"/><ellipse rx="94" ry="32" transform="rotate(48)" fill="none" stroke="#FFF0B2" stroke-width="2"/><path d="M-58 -35L-44 -72L-15 -49L0 -90L16 -49L45 -72L59 -35L44 -16H-44Z" fill="url(#g)" stroke="#FFF0B2" stroke-width="3"/><circle cy="-70" r="7" fill="#FFF9D9" filter="url(#glow)"/><circle cx="-43" cy="-55" r="5" fill="#FFF0B2"/><circle cx="43" cy="-55" r="5" fill="#FFF0B2"/><path d="M-48 -16L-41 35L0 62L41 35L48 -16Z" fill="url(#g)" stroke="#FFF0B2" stroke-width="2.5"/><path d="M-48 -16L0 5L48 -16M-41 35L0 5L41 35M0 5V62" fill="none" stroke="#FFF5CC" stroke-width="2"/><path d="M-17 -3L0 -26L17 -3L0 21Z" fill="#FFF0B2" stroke="#A96A19" stroke-width="2"/></g><text x="20" y="300" fill="#F8D77C" font-size="11" font-weight="800">CROWN · ROYAL GEM · TRIPLE ORBIT</text><text x="20" y="317" fill="#B7A47B" font-size="10">Must dominate every tier at first glance</text></g>
<g transform="translate(410 135)"><rect width="330" height="330" rx="18" fill="url(#card)" stroke="#B94A59"/><text x="20" y="32" fill="#F08B91" font-size="13" font-weight="800">SS · THE ROYAL HEIR</text><text x="20" y="58" fill="#FFE0E0" font-size="20" font-weight="800">CRIMSON DYNAST</text><text x="20" y="78" fill="#B99A9D" font-size="11">Ruby · smaller crown · ceremonial mantle</text><g transform="translate(165 190)"><circle r="85" fill="#C02645" opacity=".16" filter="url(#glow)"/><ellipse rx="78" ry="28" transform="rotate(-28)" fill="none" stroke="#F3A3A5" stroke-width="2.5"/><path d="M-44 -29L-34 -61L-12 -44L0 -70L14 -44L36 -60L45 -28L30 -10H-30Z" fill="url(#r)" stroke="#FFD1D1" stroke-width="2.5"/><path d="M-45 -10L-38 34L0 55L38 34L45 -10Z" fill="url(#r)" stroke="#FCA5A5" stroke-width="2"/><path d="M-38 14L0 -2L38 14M0 -2V55" stroke="#FFD1D1" fill="none" stroke-width="1.6"/><path d="M-12 -3L0 -21L12 -3L0 16Z" fill="#FFE4E6" stroke="#9F1239" stroke-width="2"/><circle r="65" fill="none" stroke="#B94A59" stroke-dasharray="3 8"/></g><text x="20" y="300" fill="#FCA5A5" font-size="11" font-weight="800">SMALL CROWN · RUBY CORE · ORBIT</text><text x="20" y="317" fill="#B99A9D" font-size="10">Royal, but visibly subordinate to SSS</text></g>
<g transform="translate(765 135)"><rect width="330" height="330" rx="18" fill="url(#card)" stroke="#8B70D5"/><text x="20" y="32" fill="#B9A6FF" font-size="13" font-weight="800">S · THE HIGH NOBILITY</text><text x="20" y="58" fill="#E7DEFF" font-size="20" font-weight="800">SAPPHIRE DUKE</text><text x="20" y="78" fill="#A99DBD" font-size="11">Noble house · heraldic shield · gem</text><g transform="translate(165 190)"><circle r="78" fill="#7251C8" opacity=".15" filter="url(#glow)"/><path d="M0 -64L53 -34L53 24L0 60L-53 24L-53 -34Z" fill="url(#p)" stroke="#D8CCFF" stroke-width="2.5"/><path d="M0 -64V60M-53 -34L0 0L53 -34M-53 24L0 0L53 24" fill="none" stroke="#E9DDFF" stroke-width="1.7"/><path d="M0 -36L23 -11L0 16L-23 -11Z" fill="url(#b)" stroke="#DCEBFF" stroke-width="2"/><path d="M-69 -5A70 70 0 0 1 69 -5M-57 37A70 70 0 0 0 57 37" fill="none" stroke="#B9A6FF" stroke-width="2"/></g><text x="20" y="300" fill="#C4B5FD" font-size="11" font-weight="800">HERALDIC GEM · SHIELD CUT · HALF ORBITS</text><text x="20" y="317" fill="#A99DBD" font-size="10">High nobility, no imperial crown</text></g>
<g transform="translate(1120 135)"><rect width="325" height="330" rx="18" fill="url(#card)" stroke="#4F8ACD"/><text x="20" y="32" fill="#82B9F5" font-size="13" font-weight="800">A · THE KNIGHTLY ORDER</text><text x="20" y="58" fill="#DCEBFF" font-size="20" font-weight="800">AZURE KNIGHT</text><text x="20" y="78" fill="#9CB1C8" font-size="11">Disciplined · armored · elite guard</text><g transform="translate(162 190)"><circle r="72" fill="#3B82F6" opacity=".12" filter="url(#glow)"/><path d="M0 -55L42 -32L47 16L0 50L-47 16L-42 -32Z" fill="url(#b)" stroke="#BBD8FF" stroke-width="2.2"/><path d="M0 -55V50M-42 -32L0 -5L42 -32M-47 16L0 -5L47 16" fill="none" stroke="#DCEBFF" stroke-width="1.6"/><path d="M-60 -5A61 61 0 0 1 60 -5" fill="none" stroke="#8FC2FF" stroke-width="2"/></g><text x="20" y="300" fill="#BFDBFE" font-size="11" font-weight="800">ARMORED PRISM · SINGLE STEEL HALO</text><text x="20" y="317" fill="#9CB1C8" font-size="10">Elite service, not royal authority</text></g>
<g transform="translate(230 500)"><rect width="330" height="330" rx="18" fill="url(#card)" stroke="#4D9D83"/><text x="20" y="32" fill="#7DD3B0" font-size="13" font-weight="800">B · THE GUILDED CLASS</text><text x="20" y="58" fill="#D1FAE5" font-size="20" font-weight="800">JADE MERCHANT</text><text x="20" y="78" fill="#9ABDB1" font-size="11">Prosperous artisan · trade seal</text><g transform="translate(165 190)"><circle r="63" fill="#34D399" opacity=".1" filter="url(#glow)"/><circle r="47" fill="url(#j)" stroke="#A7F3D0" stroke-width="2"/><path d="M-32 -7Q0 -42 32 -7Q0 27 -32 -7Z" fill="none" stroke="#D1FAE5" stroke-width="2"/><path d="M-54 0A54 54 0 0 1 54 0" fill="none" stroke="#6EE7B7" stroke-width="2"/><path d="M-16 -3L0 -20L16 -3L0 15Z" fill="#D1FAE5" opacity=".55"/></g><text x="20" y="300" fill="#A7F3D0" font-size="11" font-weight="800">JADE BEAD · TRADE SEAL · SIMPLE HALO</text><text x="20" y="317" fill="#9ABDB1" font-size="10">Guild wealth, no aristocratic regalia</text></g>
<g transform="translate(585 500)"><rect width="330" height="330" rx="18" fill="url(#card)" stroke="#64748B"/><text x="20" y="32" fill="#AAB7C8" font-size="13" font-weight="800">C · THE COMMON CRAFT</text><text x="20" y="58" fill="#D5DCE5" font-size="20" font-weight="800">IRON CRAFTER</text><text x="20" y="78" fill="#9AA6B5" font-size="11">Practical · forged · work-worn</text><g transform="translate(165 190)"><path d="M-47 -34L-14 -52L29 -44L49 -8L39 34L-3 48L-43 24L-55 -8Z" fill="url(#i)" stroke="#AAB7C8" stroke-width="1.8"/><path d="M-47 -34L-14 -52L-4 -9L-55 -8ZM-14 -52L29 -44L-4 -9ZM29 -44L49 -8L-4 -9ZM-55 -8L-4 -9L-43 24Z" fill="#CBD5E1" opacity=".17"/><path d="M-43 -5L-26 -1M19 20L35 11" stroke="#E2E8F0" stroke-width="2" opacity=".4"/></g><text x="20" y="300" fill="#CBD5E1" font-size="11" font-weight="800">ROUGH IRON · NO ORBIT · NO GEM</text><text x="20" y="317" fill="#9AA6B5" font-size="10">Utilitarian working-class silhouette</text></g>
<g transform="translate(940 500)"><rect width="330" height="330" rx="18" fill="url(#card)" stroke="#665447"/><text x="20" y="32" fill="#B99A7C" font-size="13" font-weight="800">D · THE COMMON FOLK</text><text x="20" y="58" fill="#D6B99A" font-size="20" font-weight="800">EARTHEN PEASANT</text><text x="20" y="78" fill="#A99582" font-size="11">Humble · handmade clay · unadorned</text><g transform="translate(165 190)"><path d="M-35 -21Q-30 -43 -7 -42Q16 -49 34 -27Q49 -8 33 17Q19 39 -7 34Q-35 36 -43 10Q-48 -7 -35 -21Z" fill="url(#c)" stroke="#B99A7C" stroke-width="1.6"/><path d="M-29 -17Q-10 -30 10 -20M-24 12Q-2 25 22 10" fill="none" stroke="#E1C5A7" stroke-width="2" opacity=".35"/><circle cx="-13" cy="-15" r="3" fill="#E1C5A7" opacity=".45"/></g><text x="20" y="300" fill="#D6B99A" font-size="11" font-weight="800">HANDMADE CLAY · NO HALO · NO DECORATION</text><text x="20" y="317" fill="#A99582" font-size="10">Lowest status: plain, modest, grounded</text></g>
<g transform="translate(55 875)"><rect width="1390" height="82" rx="14" fill="#10141D" stroke="#5B5145" opacity=".95"/><text x="22" y="29" fill="#F3E8D1" font-size="12" font-weight="800">VISUAL STATUS: EMPEROR → DYNAST → DUKE → KNIGHT → MERCHANT → CRAFTER → PEASANT</text><text x="22" y="54" fill="#9CA3AF" font-size="11">Orb material, ornament and silhouette express rank. Trail heatmap remains independent: SSS gold orb still leaves a white trail.</text></g>
<text x="57" y="985" fill="#7F8490" font-size="10">Design reference only · visual hierarchy does not modify detection, scoring, lifecycle, coordinates, or probabilities.</text></g></svg>